<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Space Shooter Ranking</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <main class="tarjeta-auth" role="main">
      <h1>Space Shooter Ranking</h1>
      <p class="subtitulo">Inicia sesi&oacute;n para jugar y registrar tus puntuaciones.</p>

      <form id="formulario-login" novalidate>
        <div class="campo">
          <label for="email">Correo electr&oacute;nico</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="tu@correo.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="campo">
          <label for="password">Contrase&ntilde;a</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>

        <button type="submit" class="boton">Iniciar sesi&oacute;n</button>
      </form>

      <p id="mensaje-login" class="mensaje-estado" role="status"></p>

      <p class="enlace">
        ¿No tienes cuenta?
        <a href="registro.html">Regístrate aquí</a>
      </p>
      <p class="enlace">
        <a href="ranking.html">Ver ranking global</a>
      </p>
    </main>

    <!-- Lógica específica de la página de login. -->
    <script type="module" src="./src/pages/login.js"></script>
  </body>
</html>
